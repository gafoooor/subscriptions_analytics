name: 'subscriptions_analytics'
version: '1.0.0'
config-version: 2

profile: 'subscriptions_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  subscriptions_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view        # initialization: view
    marts:
      +materialized: table       # initialization: table
      facts:
        +materialized: incremental  # initialization: incremental (set per model too)
